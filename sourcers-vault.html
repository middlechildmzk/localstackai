function flatTools(){return LAYERS.flatMap((l,i)=>l.tools.map(t=>({...t,layer:l.name,layerId:l.id,color:LAYER_COLORS[i],risk:t.deprecated?'Avoid':(t.name.includes('Phantom')||t.name.includes('TexAu')?'Caution':'Active'),stage:stageFor(t,l)})))}
function stageFor(t,l){const s=(t.name+' '+t.tag+' '+l.name).toLowerCase();if(s.includes('outreach')||s.includes('sequence')||s.includes('calendly')||s.includes('loom'))return 'Outreach';if(s.includes('contact')||s.includes('email')||s.includes('enrich')||s.includes('waterfall')||s.includes('api'))return 'Enrichment';if(s.includes('ats')||s.includes('crm')||s.includes('avature')||s.includes('greenhouse'))return 'ATS/CRM';if(s.includes('screen')||s.includes('interview')||s.includes('hirevue'))return 'Screening';if(s.includes('cleared')||s.includes('govcon')||s.includes('federal'))return 'Cleared';if(s.includes('osint')||s.includes('scrap')||s.includes('x-ray')||s.includes('github'))return 'OSINT';return 'Search'}

iv><div class="mono text-[9px]" style="color:var(--text3)">VISIBLE</div></div><div class="card p-2"><div class="text-white font-bold">${STATE.stack.length}</div><div class="mono text-[9px]" style="color:var(--text3)">STACK</div></div><div class="card p-2"><div class="text-white font-bold">${STATE.compare.length}</div><div class="mono text-[9px]" style="color:var(--text3)">COMPARE</div></div></div><button class="btn btn-primary w-full mt-3" onclick="showTab('stack')">Open Stack Builder</button>${STATE.compare.length?`<button class="btn w-full mt-2" onclick="showCompare()">Compare Selected</button>`:''}</aside><div><div class="mb-3 p-3" style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.18);border-radius:8px;color:#fecaca;font-size:12px"><b>Deprecated notice:</b> Proxycurl shut down July 4, 2025 and Pipl public product shut down in 2023. Both are marked Avoid.</div>${LAYERS.map((layer,i)=>{let c=LAYER_COLORS[i];let items=filtered.filter(t=>t.layerId===layer.id); if(!items.length)return '';return `<div class="mb-6"><div class="flex items-center gap-2 mb-2"><span class="mono text-[10px]" style="color:${c.text}">L${String(layer.id).padStart(2,'0')}</span><div style="width:5px;height:5px;border-radius:50%;background:${c.dot}"></div><h3 class="text-white font-semibold">${layer.name}</h3><span class="ml-auto chip" style="background:${c.bg};color:${c.text};border-color:${c.border}">${items.length} visible</span></div><p class="text-xs mb-3" style="color:var(--text3)">${layer.desc}</p><div class="vault-grid">${items.map(toolCard).join('')}</div></div>`}).join('')}</div></div>`}
function toolCard(t){return `<div class="card fade" style="padding:12px;border-color:${t.risk==='Avoid'?'rgba(239,68,68,.3)':t.color.border};${t.risk==='Avoid'?'opacity:.75':''}"><div class="flex items-start justify-between gap-2 mb-2"><div class="min-w-0"><div class="flex items-center gap-2"><span class="mono text-[9px]" style="color:var(--text3)">#${String(t.n).padStart(2,'0')}</span><b class="text-white truncate">${t.name}</b></div><div class="mono text-[9px] mt-1" style="color:${t.color.text}">${t.layer}</div></div><span class="chip" style="background:${t.color.bg};color:${t.color.text};border-color:${t.color.border}">${t.tag}</span></div><p class="text-xs mb-3" style="color:var(--text2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">${t.desc}</p><div class="flex flex-wrap gap-1 mb-3"><span class="chip" style="background:rgba(14,165,233,.07);color:#38bdf8;border-color:rgba(14,165,233,.18)">${t.stage}</span><span class="chip" style="background:${t.risk==='Avoid'?'rgba(239,68,68,.08)':t.risk==='Caution'?'rgba(251,191,36,.08)':'rgba(52,211,153,.08)'};color:${t.risk==='Avoid'?'#f87171':t.risk==='Caution'?'#fbbf24':'#34d399'};border-color:rgba(255,255,255,.08)">${t.risk}</span></div><div class="grid grid-cols-3 gap-2"><button class="btn btn-primary" onclick="addTool('${escAttr(t.name)}')">Add</button><button class="btn" onclick="toggleCompare('${escAttr(t.name)}')">Compare</button><button class="btn" onclick="useWorkflow('${escAttr(t.name)}')">Use</button></div></div>`}

function renderAgents(){document.getElementById('agents').innerHTML=`<div class="mb-6"><h2 class="text-white text-xl font-bold">Automation & Agent Architecture</h2><p class="text-xs" style="color:var(--text2)">Recruiting automation should be classified by where human judgment remains in the loop.</p></div><div class="vault-grid mb-8">${LEVELS.map(l=>`<div class="card p-4" style="border-color:${l.color}35"><div class="flex items-center gap-2 mb-2"><span class="mono" style="color:${l.color}">L${l.n}</span><b class="text-white">${l.name}</b></div><div class="mono text-[10px] mb-2" style="color:var(--text3)">${l.sub}</div><p class="text-xs" style="color:var(--text2)">${l.desc}</p></div>`).join('')}</div><div class="vault-grid">${AGENTS.map((a,i)=>{let rule=i===3||i===5?'Needs review / never final authority':i===1||i===2?'Human approves outward actions':'Safe to assist with human checkpoint';return `<div class="card p-4" style="border-color:${a.c}30"><div class="flex items-start justify-between gap-2 mb-2"><h3 class="text-white font-semibold">${a.name}</h3><span class="chip" style="background:${a.c}12;color:${a.c};border-color:${a.c}30">${rule}</span></div><div class="mono text-[10px] mb-2" style="color:${a.c}">${a.pos}</div><p class="text-xs mb-3" style="color:var(--text2)">${a.mechanics}</p><div class="flex flex-wrap gap-1 mb-3">${a.infra.map(x=>`<span class="chip" style="background:${a.c}10;color:${a.c};border-color:${a.c}25">${x}</span>`).join('')}</div><div class="p-3" style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:6px"><b class="condense text-[10px] tracking-widest" style="color:#f87171">SYSTEM LIMITATION</b><p class="text-xs" style="color:var(--text2)">${a.limits}</p></div></div>`}).join('')}</div>`}
function renderCleared(){document.getElementById('cleared').innerHTML=`<div class="wide-grid" style="display:grid;grid-template-columns:1fr 360px;gap:14px"><div><div class="card p-4 mb-4" style="background:rgba(245,158,11,.05);border-color:rgba(245,158,11,.24)"><div class="condense text-[10px] tracking-widest" style="color:#fbbf24;font-weight:700">CLEARED SOURCING DOCTRINE</div><p class="text-xs mt-2" style="color:#fde68a">Public signals are breadcrumbs, not verified clearance. The system can infer probability, but a human must verify eligibility, portability, customer fit, and compliance boundaries.</p></div><div class="vault-grid mb-4">${['Intake clearance/access requirements','Map target primes, subs, agencies, and corridors','Build proxy-signal Boolean and X-Ray strings','Score confidence from employer + MOS + location + cert + title','Draft OPSEC-safe outreach','Human verification before disposition'].map((x,i)=>`<div class="card p-3"><span class="mono" style="color:#38bdf8">0${i+1}</span><div class="text-white font-semibold mt-1">${x}</div></div>`).join('')}</div><div id="cleared-output" class="card p-4 hidden"><pre class="text-xs" style="color:var(--text2)"></pre></div></div><aside class="card p-4"><div class="condense text-[10px] tracking-widest" style="color:var(--text3);font-weight:700">CLEARED SEARCH BUILDER</div><h2 class="text-white font-bold text-lg mb-2">Generate safe search logic</h2><input id="cl-role" class="field w-full mb-2" placeholder="Role, e.g. DevSecOps Engineer"><input id="cl-agency" class="field w-full mb-2" placeholder="Agency/customer, e.g. NRO, DISA"><input id="cl-loc" class="field w-full mb-2" placeholder="Location corridor, e.g. Chantilly VA"><input id="cl-tech" class="field w-full mb-3" placeholder="Core tech/certs, e.g. AWS Kubernetes Sec+"><button class="btn btn-primary w-full" onclick="buildClearedSearch()">Build Search Pack</button></aside></div>`}
function renderPrompts(){const all=[...PROMPTS_GENERAL,...PROMPTS_CLEARED];document.getElementById('prompts').innerHTML=`<div class="mb-5"><h2 class="text-white text-xl font-bold">Prompt Bench</h2><p class="text-xs" style="color:var(--text2)">Production prompts with copy and simulated handoff into SourcingOS modules.</p></div><div class="vault-grid">${all.map((p,i)=>`<div class="card p-4"><div class="flex items-start justify-between gap-2 mb-2"><h3 class="text-white font-semibold">${p.title}</h3><span class="chip" style="background:${p.c}12;color:${p.c};border-color:${p.c}30">${p.tag}</span></div><p class="text-xs mb-3" style="color:var(--text2)">${p.desc}</p><pre id="prompt-${i}" class="text-[10px] p-3 mb-3" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text2);max-height:220px;overflow:auto">${esc(p.text)}</pre><div class="grid grid-cols-2 gap-2"><button class="btn btn-primary" onclick="copyEl('prompt-${i}')">Copy Prompt</button><button class="btn" onclick="savePrompt('${p.id}','Role Intake')">Use in Intake</button><button class="btn" onclick="savePrompt('${p.id}','Boolean Builder')">Use in Boolean</button><button class="btn" onclick="savePrompt('${p.id}','Outreach Lab')">Use in Outreach</button></div></div>`).join('')}</div>`}
function renderMetrics(){document.getElementById('metrics').innerHTML=`<div class="wide-grid" style="display:grid;grid-template-columns:1fr 360px;gap:14px"><div><div class="vault-grid mb-5">${METRICS_GENERAL.map(m=>`<div class="card p-4"><div class="condense text-3xl font-bold" style="color:${m.cat==='eff'?'#38bdf8':'#34d399'}">${m.v}</div><div class="text-white font-semibold">${m.l}</div><p class="text-xs" style="color:var(--text3)">${m.d}</p></div>`).join('')}</div><div class="card overflow-hidden"><table class="w-full text-xs"><thead><tr style="background:var(--bg3);border-bottom:1px solid var(--border)"><th class="text-left p-3" style="color:var(--text3)">Metric</th><th class="text-left p-3" style="color:#f87171">Standard</th><th class="text-left p-3" style="color:#34d399">SourcingOS</th><th class="text-left p-3" style="color:#38bdf8">Impact</th></tr></thead><tbody>${METRICS_CLEARED.map((m,i)=>`<tr style="border-bottom:1px solid var(--border);background:${i%2?'var(--bg3)':'var(--bg)'}"><td class="p-3 text-white">${m.metric}</td><td class="p-3 mono" style="color:#f87171">${m.std}</td><td class="p-3 mono" style="color:#34d399">${m.opt}</td><td class="p-3" style="color:var(--text2)">${m.impact}</td></tr>`).join('')}</tbody></table></div><div id="roi-output" class="card p-4 mt-4 hidden"><pre class="text-xs" style="color:var(--text2)"></pre></div></div><aside class="card p-4"><div class="condense text-[10px] tracking-widest" style="color:var(--text3);font-weight:700">ROI MEMO BUILDER</div><h2 class="text-white font-bold text-lg mb-2">Leadership-ready summary</h2><input id="roi-pain" class="field w-full mb-2" placeholder="Pain, e.g. aging cleared reqs"><input id="roi-role" class="field w-full mb-2" placeholder="Role type"><input id="roi-team" class="field w-full mb-2" placeholder="Team size"><input id="roi-time" class="field w-full mb-2" placeholder="Current time-to-shortlist"><input id="roi-rate" class="field w-full mb-3" placeholder="Current response rate"><button class="btn btn-primary w-full" onclick="buildRoiMemo()">Build ROI Memo</button></aside></div>`}
function showTab(id){document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));document.querySelectorAll('.tab-btn').forEach(b=>{b.style.color='var(--text3)';b.style.borderBottomColor='transparent'});document.getElementById(id).classList.remove('hidden');document.getElementById(id).classList.add('fade');let b=document.getElementById('btn-'+id);b.style.color='#38bdf8';b.style.borderBottomColor='#0ea5e9';document.getElementById('status-msg').textContent={tools:'Tools Directory — search/filter/compare/add to stack',stack:'Stack Builder — scenario-specific sourcing stack recommendations',methods:'Methods Library — copyable sourcing playbooks',agents:'Automation & Agents — human-in-loop guardrails',cleared:'Cleared Playbook — proxy signals and OPSEC-safe search logic',prompts:'Prompt Bench — copy or handoff prompts to modules',metrics:'Metrics & ROI — build leadership-ready ROI memo'}[id]||'Ready'}
function addTool(name){if(!STATE.stack.includes(name))STATE.stack.push(name);localStorage.setItem('sos_saved_stack',JSON.stringify(STATE.stack));toast(`${name} added to stack`);renderTools();if(!document.getElementById('stack').classList.contains('hidden'))renderStack()}
function toggleCompare(name){if(STATE.compare.includes(name))STATE.compare=STATE.compare.filter(x=>x!==name);else STATE.compare.push(name);toast(`${name} ${STATE.compare.includes(name)?'added to':'removed from'} compare`);renderTools()}
function showCompare(){let tools=flatTools().filter(t=>STATE.compare.includes(t.name));copyText(tools.map(t=>`${t.name} | ${t.stage} | ${t.risk}\nBest use: ${t.desc}`).join('\n\n'));toast('Comparison copied to clipboard')}
function useWorkflow(name){localStorage.setItem('sos_workflow_tool',name);toast(`${name} saved as selected workflow tool`)}
function saveScenarioStack(name){let s=SCENARIOS[name];[...s.core,...s.osint,...s.enrich,...s.outreach,...s.ats].forEach(x=>{if(!STATE.stack.includes(x))STATE.stack.push(x)});localStorage.setItem('sos_saved_stack',JSON.stringify(STATE.stack));toast(`${name} stack saved`);renderStack()}
function clearStack(){STATE.stack=[];localStorage.setItem('sos_saved_stack','[]');toast('Stack cleared');renderStack();renderTools()}
function exportStack(name){let s=SCENARIOS[name];let out=`# SourcingOS Stack — ${name}\n\n## Workflow\n${s.workflow}\n\n## Core Platform\n- ${s.core.join('\n- ')}\n\n## OSINT / Browser Layer\n- ${s.osint.join('\n- ')}\n\n## Contact Waterfall\n- ${s.enrich.join('\n- ')}\n\n## Outreach\n- ${s.outreach.join('\n- ')}\n\n## ATS / CRM\n- ${s.ats.join('\n- ')}\n\n## Compliance Cautions\n- ${s.cautions.join('\n- ')}`;let box=document.getElementById('stack-export');box.classList.remove('hidden');box.querySelector('pre').textContent=out;copyText(out);toast('Markdown stack copied')}
function buildClearedSearch(){let role=v('cl-role')||'Cleared Engineer',agency=v('cl-agency')||'DoD customer',loc=v('cl-loc')||'DC / Northern Virginia corridor',tech=v('cl-tech')||'cloud cyber systems';let titles=[role,role.replace('Engineer','Specialist'),'ISSO','DevSecOps Engineer','Cyber Engineer'];let contractors=['Booz Allen','CACI','Peraton','Leidos','GDIT','SAIC','Northrop Grumman','Raytheon','ManTech','Amentum'];let terms=['TS/SCI','polygraph','classified customer','government client','SCIF','DoD 8570','DoD 8140',...tech.split(/[, ]+/).filter(Boolean)];let bool=`(${titles.map(x=>'"'+x+'"').join(' OR ')}) AND (${terms.slice(0,8).map(x=>'"'+x+'"').join(' OR ')}) AND (${contractors.slice(0,6).map(x=>'"'+x+'"').join(' OR ')}) AND "${loc}"`;let xray=`site:linkedin.com/in (${titles.slice(0,4).map(x=>'"'+x+'"').join(' OR ')}) (${contractors.slice(0,6).map(x=>'"'+x+'"').join(' OR ')}) ("${loc}" OR "government client" OR SCIF) -jobs -hiring`;let out=`# Cleared Search Pack\n\nRole: ${role}\nAgency/customer context: ${agency}\nLocation corridor: ${loc}\nTech/certs: ${tech}\n\nTarget titles:\n- ${titles.join('\n- ')}\n\nTarget contractors:\n- ${contractors.join('\n- ')}\n\nProxy terms:\n- ${terms.join('\n- ')}\n\nBoolean:\n${bool}\n\nGoogle X-Ray:\n${xray}\n\nOutreach angle:\nLead with unclassified technical mission fit. Never claim clearance tier. Use language like: “If you maintain active eligibility within the IC or DoD framework...”`;let box=document.getElementById('cleared-output');box.classList.remove('hidden');box.querySelector('pre').textContent=out;copyText(out);toast('Cleared search pack copied')}
function buildRoiMemo(){let pain=v('roi-pain')||'slow top-of-funnel sourcing';let role=v('roi-role')||'technical and cleared roles';let team=v('roi-team')||'the sourcing team';let time=v('roi-time')||'multiple weeks';let rate=v('roi-rate')||'low single-digit response rates';let out=`# SourcingOS ROI Memo\n\nCurrent challenge: ${pain}. For ${role}, ${team} is currently seeing time-to-shortlist around ${time} and response rates around ${rate}.\n\nSourcingOS improves this by turning intake into structured search lanes, preserving source-specific evidence, supporting safe candidate scoring, and generating OPSEC-aware outreach drafts with human approval. The expected impact is faster top-of-funnel hydration, cleaner candidate evidence, stronger response rates from high-signal personalization, and less recruiter time spent rebuilding search logic from scratch.\n\nRecommended rollout:\n1. Use Role Intake to normalize must-haves and disqualifiers.\n2. Build 3–5 source lanes with strict vs expanded market logic.\n3. Save candidates with evidence and uncertainty notes.\n4. Draft outreach and HM updates from the same project record.\n5. Review weekly conversion and recalibrate lanes based on feedback.\n\nGovernance: SourcingOS should remain a decision-support layer. Screening, rejection, clearance verification, and final disposition require human review.`;let box=document.getElementById('roi-output');box.classList.remove('hidden');box.querySelector('pre').textContent=out;copyText(out);toast('ROI memo copied')}
function savePrompt(id,module){localStorage.setItem('sos_selected_prompt',id+'|'+module);toast(`Prompt saved for ${module}`)}
function copyEl(id){copyText(document.getElementById(id).textContent);toast('Copied')}
function copyText(text){navigator.clipboard?.writeText(text).catch(()=>fallbackCopy(text))||fallbackCopy(text)}function fallbackCopy(text){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1900)}function v(id){return document.getElementById(id)?.value.trim()}function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function escAttr(s){return String(s).replace(/'/g,"&#39;").replace(/"/g,'&quot;')}
window.onload=()=>{renderTools();renderStack();renderMethods();renderAgents();renderCleared();renderPrompts();renderMetrics();showTab('tools')};
</script>
</body>
</html>
